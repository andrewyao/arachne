[package]
name = "arachne"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.33"
mime_guess = "2.0.5"
open = "5.4.4"
protobuf = "3"
rust-embed = "8.12.0"
scip = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
